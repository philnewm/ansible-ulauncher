---

state: present

ulauncher_rpm_src_url: "https://github.com/philnewm/Ulauncher/releases/download/5.15.15/ulauncher_5.15.15_almalinux9.rpm"
ulauncher_download_path: "~/ulauncher"
ulauncher_gnome_systemwide_default_base: "/etc/dconf/db/local.d/00-gnome-base"

ulauncher_include_user_config: true
ulauncher_hotkey_dconf_path: "org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/ulauncher"
ulauncher_default_shortcut: "<Alt>space"
ulauncher_hotkey_parameters:
  - name: "name"
    value: "'Ulauncher'"
  - name: "command"
    value: "'ulauncher-toggle'"
  - name: "binding"
    value: "'{{ ulauncher_default_shortcut }}'"
ulauncher_settings_dir: "/etc/skel/.config/ulauncher"
ulauncher_themes_dir: "{{ ulauncher_settings_dir }}/user-themes"

ulauncher_settings:
  "blacklisted-desktop-dirs": "/usr/share/locale:/usr/share/app-install:/usr/share/kservices5:/usr/share/fk5:/usr/share/kservicetypes5:/usr/share/applications/screensavers:/usr/share/kde4:/usr/share/mimelnk"
  "clear-previous-query": true
  "disable-desktop-filters": false
  "grab-mouse-pointer": false
  "hotkey-show-app": "<Alt>space"
  "render-on-screen": "mouse-pointer-monitor"
  "show-indicator-icon": true
  "show-recent-apps": "10"
  "terminal-command": ""
  "theme-name": "Omni"

ulauncher_extensions:
  "com.github.friday.ulauncher-gnome-settings":
    id: "com.github.friday.ulauncher-gnome-settings"
    url: "https://github.com/friday/ulauncher-gnome-settings"

  "com.github.zensoup.ulauncher-unicode":
    id: "com.github.zensoup.ulauncher-unicode"
    url: "https://github.com/zensoup/ulauncher-unicode"

  "com.github.manahter.ulauncher-translate":
    id: "com.github.manahter.ulauncher-translate"
    url: "https://github.com/manahter/ulauncher-translate"

  "com.github.ulauncher.ulauncher-kill":
    id: "com.github.ulauncher.ulauncher-kill"
    url: "https://github.com/Ulauncher/ulauncher-kill"

ulauncher_github_repo_theme:
  - name: "ulauncher omni theme"
    repo_name: "ulauncher_theme"
    branch: "main"
    repo_url: "https://github.com/philnewm/ulauncher_theme/archive/refs/heads/main.zip"
    target_dir: "{{ ulauncher_themes_dir }}/omni"

...
