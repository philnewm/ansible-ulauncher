---

- name: Include vars file if provided
  when: ulauncher_vars_file != None
  ansible.builtin.include_vars:
    file: "{{ ulauncher_vars_file }}"

- name: Gather package facts
  ansible.builtin.package_facts:

- name: Install Ulauncher on based on distro
  when: "'ulauncher' not in ansible_facts.packages"
  ansible.builtin.include_tasks:
    file: "install_{{ ulauncher_install_matrix[ansible_facts.distribution | lower] }}.yml"

- name: Ensure gnome hotkey overwrite is present
  when: "'gnome-shell' in ansible_facts.packages"
  block:
    - name: Ensure system-wide gnome defaults directory exist
      become: true
      ansible.builtin.file:
        path: "{{ ulauncher_gnome_systemwide_default_base | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Disable Alt+Space for 'Activate the Window menu'
      become: true
      community.general.ini_file:
        path: "{{ ulauncher_gnome_systemwide_default_base }}"
        section: "org/gnome/desktop/wm/keybindings"
        option: "activate-window-menu"
        value: "{{ '@as []' | string }}"
        owner: root
        group: root
        mode: "0644"
      notify: Update dconf

- name: Include wayland adjustments
  when: ulauncher_wayland and 'gnome-shell' in ansible_facts.packages
  ansible.builtin.include_tasks:
    file: wayland_config.yml

- name: "Include config"
  when: ulauncher_include_user_config
  ansible.builtin.include_tasks:
    file: user_config.yml

...
