---

- name: Enable 'universe' repository (deb822, Ubuntu 24.04+)
  become: true
  ansible.builtin.deb822_repository:
    name: ubuntu
    types: [deb]
    uris: ["http://archive.ubuntu.com/ubuntu/"]
    suites:
      - "{{ ansible_facts.distribution_release }}"
      - "{{ ansible_facts.distribution_release }}-updates"
      - "{{ ansible_facts.distribution_release }}-security"
      - "{{ ansible_facts.distribution_release }}-backports"
    components: [main, universe]
    signed_by: /usr/share/keyrings/ubuntu-archive-keyring.gpg
    state: present
    install_python_debian: true
  register: ubuntu_repo

- name: Update apt cache if repo changed
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: ubuntu_repo.changed  # noqa: no-handler

- name: Ensure packages needed for adding PPAs are installed
  become: true
  ansible.builtin.apt:
    name:
      - software-properties-common
      - gnupg
      - dirmngr
      - ca-certificates
    state: present
    update_cache: true

- name: Add Ulauncher PPA
  become: true
  ansible.builtin.apt_repository:
    repo: "ppa:agornostal/ulauncher"
    state: present

- name: Update package cache
  become: true
  ansible.builtin.apt:
    update_cache: true

- name: Install ulauncher
  become: true
  ansible.builtin.apt:
    name: ulauncher
    state: present

...
