---

- name: Gather package facts
  ansible.builtin.package_facts:

- name: Test installed global dependencies
  loop: "{{ ulauncher_global_dependencies }}"
  when: ansible_os_family == "RedHat"
  ansible.builtin.assert:
    that:
      - item in ansible_facts.packages
    fail_msg: "Required package '{{ item }}' is missing."
    quiet: true

- name: Test installed ulauncher
  ansible.builtin.assert:
    that:
      - "'ulauncher' in ansible_facts.packages"
    fail_msg: "Ulauncher' is not installed."
    quiet: true

# INFO only checking for enabled since starting doesn't work in terminal session
- name: Check for enabled ulauncher service
  ansible.builtin.command:
    cmd: systemctl --user is-enabled ulauncher.service
  register: ulauncher_enabled_status
  changed_when: false
  failed_when: false

- name: Test running ulauncher service
  ansible.builtin.assert:
    that:
      - ulauncher_enabled_status.stdout == "enabled"
    fail_msg: "ulauncher.service is not enabled (status: {{ ulauncher_enabled_status.stdout }})"
    quiet: true

...
